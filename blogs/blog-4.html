# A List for My Circle
*Posted: August 2nd, 2026*

The first time my Steam account got hijacked, I created a support ticket. The second time, I created another one. By the third or fourth, I'd stopped being surprised and started being annoyed - not just at whoever kept trying, but at myself, for not really understanding *how*. Spear-phishing links. Fake trade sites. The occasional email that looked just convincing enough. I was, in every sense of the phrase, an idiot - the kind who could plausibly fall for any of it, because I didn't know which parts to be suspicious of in the first place. And Steam wasn't even the only thing that got caught in the crossfire over the years. It's just the one that finally made me say "this has got to end." Heaven forbid free Robux.

That's really where it started. Not some grand realization about digital rights, just being tired of emailing support.

## The domino effect

Once you start pulling on that thread, it doesn't really stop. It started small - an adblocker for YouTube, because pre-roll ads are endless. Then I noticed the ads I *was* still seeing were weirdly specific to searches I had, which sent me down the telemetry rabbit hole. Turn this off. Deny that permission. Why does Google need to remember I searched for something? Let alone my watch history.

Then it was filter lists, trying combination after combination to stop YouTube from breaking every time I blocked something new. Then it was antivirus software - the free kind, the kind you download because a sponsored forum post said to - until I realized some of it was working against me as much as for me. Bundled toolbars. Background telemetry of its own. Software that called itself a security tool while quietly doing the opposite. A new search engine I hadn't installed. That was the real turning point, honestly: not the phishing, but realizing I had no way to tell what actually worked from what just *said* it worked. I didn't have a baseline. I didn't have a foot in the door. I just had a pile of apps and services I'd installed on faith.

## Nuanced Kool-Aid

This is around when I found places like privacyguides.org and the wider community discussion around all of it, and for a while, it was genuinely rewarding. Learning something most people never think to question - why the 99th Chrome install isn't actually a neutral choice, what a messenger actually promises versus what it markets - felt like getting let in on something.

But it doesn't take long to notice the discussion-to-actual-suggestion ratio is... not great. You'll find a thread with four hundred replies and about six of them are useful. And you'll meet people who talk about privacy and security like it's a religion - like there's One True Browser and everything else is heresy. I've lost count of how many times I've had to gently explain to a friend or family member that no, the browser with the built-in "gamer" mode and the RGB logo (you know the one) isn't actually doing anything for them beyond looking cool on a stream overlay.

The real lesson underneath all of it wasn't "use X, never Y." It was that almost nothing in this space is black and white. Everything has a tradeoff. The tool that's great for one person's threat model is overkill - or useless - for someone else's. That took a while to sink in, mostly because so much of the discourse around it is served like Kool-Aid: drink this, don't ask why.

## The list

Somewhere in all of this, I started keeping a list. Not for a website, not for anyone but the handful of people who'd ask me for help - friends, family, the occasional coworker who noticed I had opinions about this stuff. Use this messenger, not that one. This browser, not that one. Definitely not that password manager, use this one instead. It was a favor, mostly. A running document I'd update whenever something changed or I learned something new. Course, I'd give them the options. Otherwise I'd be selling the same Kool-Aid.

At some point I started wondering what it would actually take to maintain something like the more well-known resources in this space - the actual research behind it seemed like the genuinely interesting part, more than the writing or the site itself. And then the homelab happened, and with it, a domain I already owned and no particular reason not to use it for something. So. Why not.

## Where that leaves things

It's live now. [The site](https://guides.willbara.dev/) exists, it's public, and it's mine in the sense that means I'm the one responsible if it's wrong. I'm not under any illusion that I'm the next great authority on this stuff - I'm one guy with a list that grew past what my group chat needed, and a couple of opinions I've actually bothered to verify. I just want to see how far I can reasonably take it. Happy to be corrected!

#privacy #technology
